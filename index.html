<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>mnanak na qalang 電子繪本</title>
  <style>
    :root {
      --bg-color: #1a1512;
      --card-bg: #2d241e;
      --accent-color: #d97736;
      --accent-hover: #f08c4a;
      --text-color: #f3ece7;
      --border-color: #594537;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh; /* 手機瀏覽器視窗高度適應 */
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
    }

    /* 1. 開始遮罩 (點擊開始解鎖音訊) */
    .start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26, 21, 18, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      text-align: center;
    }

    .start-overlay h2 {
      font-size: 2rem;
      color: var(--accent-color);
      letter-spacing: 2px;
    }

    .btn-start {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 12px 36px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(217, 119, 54, 0.5);
      transition: all 0.2s;
    }

    .btn-start:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    header {
      text-align: center;
      margin-bottom: 2px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header h1 { 
      font-size: 1.2rem; 
      color: var(--accent-color); 
      letter-spacing: 1px; 
    }

    .header-totem { font-size: 1rem; color: var(--accent-color); }

    /* 主體容器 */
    .book-container {
      position: relative;
      width: 100%;
      max-width: 920px;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      overflow: hidden;
      min-height: 0;
    }

    .viewport {
      width: 100%;
      flex: 1;
      position: relative;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      min-height: 0;
    }

    .viewport img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
    }

    /* 3. 手機版控制面板排版 */
    .controls {
      width: 100%;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 8px;
    }

    .nav-group, .audio-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 部落風按鈕 */
    .btn-tribal-nav {
      background: linear-gradient(135deg, #4a3528, #2d2017);
      border: 1px solid var(--accent-color);
      color: #fff;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-tribal-nav:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #555;
    }

    .btn-action {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .page-indicator {
      font-weight: bold;
      font-size: 0.85rem;
      min-width: 80px;
      text-align: center;
    }

    /* 音量滑桿 */
    .volume-control {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.1);
      padding: 2px 8px;
      border-radius: 12px;
    }

    .volume-slider {
      width: 50px;
      height: 4px;
      cursor: pointer;
      accent-color: var(--accent-color);
    }

    /* 底部縮圖 */
    .thumbnails {
      width: 100%;
      max-width: 920px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 4px 0 2px 0;
      flex-shrink: 0;
    }

    .thumb {
      width: 44px;
      height: 32px;
      object-fit: cover;
      border-radius: 3px;
      cursor: pointer;
      opacity: 0.4;
      border: 1.5px solid transparent;
      flex-shrink: 0;
    }

    .thumb.active { opacity: 1; border-color: var(--accent-color); }

    @media (max-width: 600px) {
      .controls { justify-content: center; }
      .volume-control { display: none; } /* 手機端隱藏滑桿，改用實體按鈕控制音量 */
      header h1 { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- 1. 開始閱讀遮罩 -->
  <div id="start-overlay" class="start-overlay">
    <h2>mnanak na qalang</h2>
    <p>原住民風互動電子繪本</p>
    <button id="btn-start" class="btn-start">📖 點擊開始閱讀</button>
  </div>

  <header>
    <span class="header-totem">◆◇◆</span>
    <h1>mnanak na qalang</h1>
    <span class="header-totem">◆◇◆</span>
  </header>

  <main class="book-container">
    <div class="viewport" id="viewport">
      <img id="book-page" src="graphics/0.jpg" alt="繪本畫面">
    </div>

    <div class="controls" role="region" aria-label="繪本控制區">
      <div class="nav-group">
        <button id="btn-prev" class="btn-tribal-nav" aria-label="上一頁">
          <span>◀❖</span>
          <span>上一頁</span>
        </button>

        <span class="page-indicator" id="page-num" aria-live="polite">封面 (0/19)</span>

        <button id="btn-next" class="btn-tribal-nav" aria-label="下一頁">
          <span>下一頁</span>
          <span>❖▶</span>
        </button>
      </div>

      <div class="audio-group">
        <button id="btn-speech" class="btn-action" aria-label="朗讀">
          <span id="txt-speech">🔊 播放朗讀</span>
        </button>

        <button id="btn-music" class="btn-action" aria-label="背景音樂">
          <span id="txt-music">🎵 播放音樂</span>
        </button>

        <div class="volume-control">
          <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1" title="音量">
        </div>

        <button id="btn-mute" class="btn-action" aria-label="靜音控制">
          <span id="txt-mute">🔇 靜音</span>
        </button>
      </div>
    </div>
  </main>

  <div class="thumbnails" id="thumb-container" role="tablist" aria-label="頁面縮圖導覽"></div>

  <audio id="audio-speech" preload="auto"></audio>
  <audio id="audio-music" loop preload="auto"></audio>

  <script>
    const totalPages = 19;
    let currentPage = 0;

    let isSpeechPlaying = false;
    let isMusicPlaying = false;
    let isMuted = false;
    let masterVolume = 1.0;
    let isInitialized = false;

    // DOM 元素
    const startOverlay = document.getElementById('start-overlay');
    const btnStart = document.getElementById('btn-start');
    
    const imgElement = document.getElementById('book-page');
    const viewport = document.getElementById('viewport');
    const pageNumElement = document.getElementById('page-num');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnSpeech = document.getElementById('btn-speech');
    const btnMusic = document.getElementById('btn-music');
    const btnMute = document.getElementById('btn-mute');
    const volumeSlider = document.getElementById('volume-slider');
    
    const txtSpeech = document.getElementById('txt-speech');
    const txtMusic = document.getElementById('txt-music');
    const txtMute = document.getElementById('txt-mute');

    const audioSpeech = document.getElementById('audio-speech');
    const audioMusic = document.getElementById('audio-music');
    const thumbContainer = document.getElementById('thumb-container');

    // 1. 初始化與遮罩解鎖
    btnStart.addEventListener('click', () => {
      startOverlay.style.display = 'none';
      isInitialized = true;
      isMusicPlaying = true; // 預設開啟音樂循環播放
      updatePage();
    });

    function initThumbnails() {
      thumbContainer.innerHTML = '';
      for (let i = 0; i <= totalPages; i++) {
        const thumb = document.createElement('img');
        thumb.src = `graphics/${i}.jpg`;
        thumb.className = `thumb ${i === 0 ? 'active' : ''}`;
        thumb.onclick = () => goToPage(i);
        thumbContainer.appendChild(thumb);
      }
    }

    function bindEvents() {
      btnPrev.addEventListener('click', () => changePage(-1));
      btnNext.addEventListener('click', () => changePage(1));
      btnSpeech.addEventListener('click', toggleSpeech);
      btnMusic.addEventListener('click', toggleMusic);
      btnMute.addEventListener('click', toggleMute);

      volumeSlider.addEventListener('input', (e) => {
        masterVolume = parseFloat(e.target.value);
        updateVolume();
      });

      // 2. 朗讀結束時，恢復背景音樂循環播放
      audioSpeech.addEventListener('ended', () => {
        isSpeechPlaying = false;
        txtSpeech.textContent = "🔊 播放朗讀";
        if (isMusicPlaying && !isMuted) {
          audioMusic.play().catch(e => console.log(e));
        }
      });

      // 4. 鍵盤操控
      document.addEventListener('keydown', (e) => {
        if (!isInitialized) return;
        if (e.code === 'ArrowLeft') changePage(-1);
        if (e.code === 'ArrowRight') changePage(1);
        if (e.code === 'Space') {
          e.preventDefault();
          toggleSpeech();
        }
        if (e.code === 'KeyM') toggleMute();
      });

      // 3. 手機觸控左右滑動支援 (Touch Swipe)
      let touchStartX = 0;
      viewport.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      viewport.addEventListener('touchend', (e) => {
        let touchEndX = e.changedTouches[0].screenX;
        if (touchStartX - touchEndX > 50) changePage(1);  // 向左滑翻下一頁
        if (touchEndX - touchStartX > 50) changePage(-1); // 向右滑翻上一頁
      }, { passive: true });
    }

    // 頁面更新
    function updatePage() {
      if (!isInitialized) return;

      // 翻頁時暫停上一頁朗讀
      audioSpeech.pause();
      audioSpeech.currentTime = 0;
      isSpeechPlaying = false;
      txtSpeech.textContent = "🔊 播放朗讀";
      
      imgElement.src = `graphics/${currentPage}.jpg`;
      pageNumElement.textContent = currentPage === 0 ? `封面 (0/${totalPages})` : `第 ${currentPage} 頁 (${currentPage}/${totalPages})`;

      btnPrev.disabled = (currentPage === 0);
      btnNext.disabled = (currentPage === totalPages);

      document.querySelectorAll('.thumb').forEach((el, idx) => {
        el.classList.toggle('active', idx === currentPage);
        if (idx === currentPage) {
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      });

      audioSpeech.src = `speech/speech${currentPage}.mp3`;
      audioMusic.src = `music/music${currentPage}.mp3`;

      updateVolume();

      // 2. 音樂循環播放邏輯 (若未在朗讀則播放音樂)
      if (isMusicPlaying && !isMuted && !isSpeechPlaying) {
        audioMusic.play().catch(e => console.log('Music blocked', e));
      }
    }

    function changePage(delta) {
      const target = currentPage + delta;
      if (target >= 0 && target <= totalPages) {
        currentPage = target;
        updatePage();
      }
    }

    function goToPage(pageIndex) {
      if (pageIndex >= 0 && pageIndex <= totalPages) {
        currentPage = pageIndex;
        updatePage();
      }
    }

    // 5. 朗讀與連按控制 (連按時切換暫停/播放，不從頭念)
    function toggleSpeech() {
      if (isSpeechPlaying) {
        // 連按時：正在念的話就暫停，不重頭念
        audioSpeech.pause();
        isSpeechPlaying = false;
        txtSpeech.textContent = "🔊 播放朗讀";
        
        // 朗讀暫停，恢復音樂
        if (isMusicPlaying && !isMuted) {
          audioMusic.play().catch(e => console.log(e));
        }
      } else {
        if (isMuted) toggleMute();
        
        // 2. 念繪本時，音樂停下來
        audioMusic.pause();
        
        audioSpeech.play().then(() => {
          isSpeechPlaying = true;
          txtSpeech.textContent = "⏸ 暫停朗讀";
        }).catch(err => {
          console.warn('朗讀檔載入失敗');
        });
      }
    }

    function toggleMusic() {
      if (isMusicPlaying) {
        audioMusic.pause();
        isMusicPlaying = false;
        txtMusic.textContent = "🎵 播放音樂";
      } else {
        if (isMuted) toggleMute();
        isMusicPlaying = true;
        txtMusic.textContent = "⏸ 暫停音樂";
        if (!isSpeechPlaying) {
          audioMusic.play();
        }
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      audioSpeech.muted = isMuted;
      audioMusic.muted = isMuted;
      txtMute.textContent = isMuted ? "🔊 解除靜音" : "🔇 靜音";
    }

    function updateVolume() {
      audioSpeech.volume = masterVolume;
      audioMusic.volume = masterVolume;
    }

    initThumbnails();
    bindEvents();
  </script>
</body>
</html>
