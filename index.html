<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>mnanak na qalang 電子繪本</title>
  <style>
    :root {
      --bg-color: #1a1512;
      --card-bg: #2d241e;
      --accent-color: #d97736;
      --accent-hover: #f08c4a;
      --text-color: #f3ece7;
      --border-color: #594537;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
    }

    /* 新增：開啟繪本的歡迎頁面遮罩 */
    .start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26, 21, 18, 0.96);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      text-align: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .start-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-overlay h2 {
      font-size: 2.2rem;
      color: var(--accent-color);
      letter-spacing: 2px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }

    .start-overlay p {
      font-size: 1.1rem;
      color: var(--text-color);
      opacity: 0.9;
    }

    .btn-start {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 14px 40px;
      font-size: 1.25rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(217, 119, 54, 0.6);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-start:hover {
      background: var(--accent-hover);
      transform: scale(1.06);
    }

    /* 載入中與錯誤覆蓋提示 */
    .status-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 50;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #fff;
    }
    .status-overlay.active { display: flex; }

    .btn-retry {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    header {
      text-align: center;
      margin-bottom: 2px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header h1 { 
      font-size: 1.2rem; 
      color: var(--accent-color); 
      letter-spacing: 1px; 
    }

    .header-totem { font-size: 1rem; color: var(--accent-color); }

    /* 繪本主體外框 */
    .book-container {
      position: relative;
      width: 100%;
      max-width: 920px;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 3px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
      overflow: hidden;
      min-height: 0;
      perspective: 1200px;
    }

    .viewport {
      width: 100%;
      flex: 1;
      position: relative;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      min-height: 0;
    }

    .viewport img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      transform-origin: left center;
      transition: transform 0.35s ease, opacity 0.35s ease;
      backface-visibility: hidden;
    }

    .flip-next { transform: rotateY(-90deg); opacity: 0; }
    .flip-prev { transform-origin: right center !important; transform: rotateY(90deg); opacity: 0; }

    /* 控制面板 */
    .controls {
      width: 100%;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 8px;
    }

    .nav-group, .audio-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action, .btn-nav {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-nav {
      background: linear-gradient(135deg, #4a3528, #2d2017);
      border: 1px solid var(--accent-color);
    }

    .page-indicator {
      font-weight: bold;
      font-size: 0.85rem;
      min-width: 80px;
      text-align: center;
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.1);
      padding: 2px 8px;
      border-radius: 12px;
    }

    .volume-slider {
      width: 50px;
      height: 4px;
      cursor: pointer;
      accent-color: var(--accent-color);
    }

    /* 縮圖導覽 */
    .thumbnails {
      width: 100%;
      max-width: 920px;
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 4px 0 2px 0;
      flex-shrink: 0;
    }

    .thumb {
      width: 44px;
      height: 32px;
      object-fit: cover;
      border-radius: 3px;
      cursor: pointer;
      opacity: 0.4;
      border: 1.5px solid transparent;
      flex-shrink: 0;
    }

    .thumb.active { opacity: 1; border-color: var(--accent-color); }

    /* 除錯面板 */
    #debug-panel {
      display: none;
      position: fixed;
      bottom: 50px;
      right: 10px;
      background: rgba(0,0,0,0.85);
      border: 1px solid var(--accent-color);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      z-index: 200;
      max-width: 260px;
    }

    @media (max-width: 600px) {
      .controls { justify-content: center; }
      .volume-control { display: none; }
      header h1 { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- 新增：開啟繪本的歡迎頁面 -->
  <div id="start-overlay" class="start-overlay">
    <h2>mnanak na qalang</h2>
    <p>原住民風互動電子繪本</p>
    <button id="btn-start" class="btn-start">📖 點擊開啟繪本</button>
  </div>

  <header>
    <span class="header-totem">◆◇◆</span>
    <h1>mnanak na qalang</h1>
    <span class="header-totem">◆◇◆</span>
  </header>

  <main class="book-container">
    <div class="viewport" id="viewport">
      <img id="book-page" src="graphics/0.jpg" alt="繪本畫面">
      
      <!-- 載入與失敗重試遮罩 -->
      <div id="loading-overlay" class="status-overlay">
        <span id="loading-text">載入中...</span>
      </div>
      <div id="error-overlay" class="status-overlay">
        <span id="error-message">素材載入失敗</span>
        <button id="btn-retry" class="btn-retry">重試</button>
      </div>
    </div>

    <div class="controls" role="region" aria-label="繪本控制區">
      <div class="nav-group">
        <button id="btn-prev" class="btn-nav" aria-label="上一頁">上一頁</button>
        <span class="page-indicator" id="page-num" aria-live="polite">0/19</span>
        <button id="btn-next" class="btn-nav" aria-label="下一頁">下一頁</button>
      </div>

      <div class="audio-group">
        <button id="btn-speech" class="btn-action" aria-label="朗讀">
          <span id="txt-speech">🔊 播放朗讀</span>
        </button>

        <button id="btn-music" class="btn-action" aria-label="背景音樂">
          <span id="txt-music">⏸ 暫停音樂</span>
        </button>

        <div class="volume-control">
          <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1" title="音量">
        </div>

        <button id="btn-mute" class="btn-action" aria-label="靜音">
          <span id="txt-mute">🔇 靜音</span>
        </button>

        <button id="btn-debug-toggle" class="btn-action" style="padding: 2px 6px; font-size: 0.7rem;" aria-label="除錯">除錯</button>
      </div>
    </div>
  </main>

  <div class="thumbnails" id="thumb-container" role="tablist" aria-label="頁面縮圖導覽"></div>

  <!-- 音訊元素 -->
  <audio id="audio-speech" preload="auto"></audio>
  <audio id="audio-music" loop preload="auto"></audio>

  <!-- 除錯控制台 -->
  <div id="debug-panel">
    <strong>[DEBUG 資訊]</strong><br>
    當前頁面: <span id="debug-page">0</span><br>
    音樂狀態: <span id="debug-music">播放中</span><br>
    朗讀狀態: <span id="debug-speech">已停止</span><br>
    靜音狀態: <span id="debug-mute">false</span>
  </div>

  <script>
    const totalPages = 19;
    let currentPage = 0;

    let isSpeechPlaying = false;
    let isMusicPlaying = true;
    let isMuted = false;
    let masterVolume = 1.0;
    let isFlipping = false;

    // DOM 元素
    const startOverlay = document.getElementById('start-overlay');
    const btnStart = document.getElementById('btn-start');

    const imgElement = document.getElementById('book-page');
    const viewport = document.getElementById('viewport');
    const pageNumElement = document.getElementById('page-num');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnSpeech = document.getElementById('btn-speech');
    const btnMusic = document.getElementById('btn-music');
    const btnMute = document.getElementById('btn-mute');
    const volumeSlider = document.getElementById('volume-slider');
    
    const txtSpeech = document.getElementById('txt-speech');
    const txtMusic = document.getElementById('txt-music');
    const txtMute = document.getElementById('txt-mute');

    const audioSpeech = document.getElementById('audio-speech');
    const audioMusic = document.getElementById('audio-music');
    const thumbContainer = document.getElementById('thumb-container');

    const loadingOverlay = document.getElementById('loading-overlay');
    const errorOverlay = document.getElementById('error-overlay');
    const btnRetry = document.getElementById('btn-retry');
    const btnDebugToggle = document.getElementById('btn-debug-toggle');
    const debugPanel = document.getElementById('debug-panel');

    function initThumbnails() {
      thumbContainer.innerHTML = '';
      for (let i = 0; i <= totalPages; i++) {
        const thumb = document.createElement('img');
        thumb.src = `graphics/${i}.jpg`;
        thumb.className = `thumb ${i === 0 ? 'active' : ''}`;
        thumb.onclick = () => goToPage(i);
        thumbContainer.appendChild(thumb);
      }
    }

    function bindEvents() {
      // 點擊「開啟繪本」按鈕事件：隱藏歡迎遮罩並立即播放聲音
      btnStart.addEventListener('click', () => {
        startOverlay.classList.add('hidden');
        if (isMusicPlaying && !isMuted) {
          audioMusic.play().catch(e => console.log('Autoplay started'));
        }
      });

      btnPrev.addEventListener('click', () => changePage(-1));
      btnNext.addEventListener('click', () => changePage(1));
      btnSpeech.addEventListener('click', toggleSpeech);
      btnMusic.addEventListener('click', toggleMusic);
      btnMute.addEventListener('click', toggleMute);
      btnRetry.addEventListener('click', () => updatePageDirectly());

      btnDebugToggle.addEventListener('click', () => {
        debugPanel.style.display = debugPanel.style.display === 'block' ? 'none' : 'block';
      });

      volumeSlider.addEventListener('input', (e) => {
        masterVolume = parseFloat(e.target.value);
        updateVolume();
      });

      // 朗讀播放結束：恢復音量
      audioSpeech.addEventListener('ended', () => {
        isSpeechPlaying = false;
        txtSpeech.textContent = "🔊 播放朗讀";
        updateVolume();
        updateDebug();
      });

      // 全域鍵盤事件監聽
      document.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft') {
          e.preventDefault();
          changePage(-1);
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          changePage(1);
        } else if (e.code === 'Space') {
          e.preventDefault();
          toggleSpeech();
        } else if (e.code === 'KeyM') {
          toggleMute();
        } else if (e.code === 'KeyD') {
          debugPanel.style.display = debugPanel.style.display === 'block' ? 'none' : 'block';
        }
      });

      // 觸控滑動支援
      let touchStartX = 0;
      viewport.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      viewport.addEventListener('touchend', (e) => {
        let touchEndX = e.changedTouches[0].screenX;
        if (touchStartX - touchEndX > 50) changePage(1);
        if (touchEndX - touchStartX > 50) changePage(-1);
      }, { passive: true });
    }

    function changePage(delta) {
      if (isFlipping) return;
      const target = currentPage + delta;
      
      if (target < 0 || target > totalPages) return;

      isFlipping = true;
      const animationClass = delta > 0 ? 'flip-next' : 'flip-prev';
      imgElement.classList.add(animationClass);

      setTimeout(() => {
        currentPage = target;
        updatePageDirectly();
        imgElement.classList.remove('flip-next', 'flip-prev');
        isFlipping = false;
      }, 300);
    }

    function goToPage(pageIndex) {
      if (isFlipping || pageIndex === currentPage) return;
      if (pageIndex >= 0 && pageIndex <= totalPages) {
        isFlipping = true;
        const animationClass = pageIndex > currentPage ? 'flip-next' : 'flip-prev';
        imgElement.classList.add(animationClass);

        setTimeout(() => {
          currentPage = pageIndex;
          updatePageDirectly();
          imgElement.classList.remove('flip-next', 'flip-prev');
          isFlipping = false;
        }, 300);
      }
    }

    function updatePageDirectly() {
      // 1. 停止舊朗讀
      audioSpeech.pause();
      audioSpeech.currentTime = 0;
      isSpeechPlaying = false;
      txtSpeech.textContent = "🔊 播放朗讀";

      // 2. 更新畫面與頁碼標示
      imgElement.src = `graphics/${currentPage}.jpg`;
      pageNumElement.textContent = `${currentPage}/${totalPages}`;

      btnPrev.style.opacity = (currentPage === 0) ? '0.4' : '1';
      btnNext.style.opacity = (currentPage === totalPages) ? '0.4' : '1';

      document.querySelectorAll('.thumb').forEach((el, idx) => {
        el.classList.toggle('active', idx === currentPage);
        if (idx === currentPage) {
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      });

      // 3. 設定新音檔來源
      audioSpeech.src = `speech/speech${currentPage}.mp3`;
      audioMusic.src = `music/music${currentPage}.mp3`;

      updateVolume();

      // 4. 自動播放當頁背景音樂
      if (isMusicPlaying && !isMuted) {
        audioMusic.play().catch(e => console.log('Music play waiting user interaction'));
      }

      preloadNextPage();
      updateDebug();
    }

    function preloadNextPage() {
      const next = currentPage + 1;
      if (next <= totalPages) {
        const nextImg = new Image();
        nextImg.src = `graphics/${next}.jpg`;
        const nextMusic = new Audio();
        nextMusic.src = `music/music${next}.mp3`;
        const nextSpeech = new Audio();
        nextSpeech.src = `speech/speech${next}.mp3`;
      }
    }

    function updateVolume() {
      audioSpeech.volume = isMuted ? 0 : masterVolume;
      if (isSpeechPlaying) {
        audioMusic.volume = isMuted ? 0 : masterVolume * 0.2;
      } else {
        audioMusic.volume = isMuted ? 0 : masterVolume;
      }
    }

    function toggleSpeech() {
      if (isSpeechPlaying) {
        audioSpeech.pause();
        isSpeechPlaying = false;
        txtSpeech.textContent = "🔊 播放朗讀";
        updateVolume();
      } else {
        isSpeechPlaying = true;
        txtSpeech.textContent = "⏸ 暫停朗讀";
        updateVolume();

        if (isMusicPlaying && !isMuted) {
          audioMusic.play().catch(e => console.log(e));
        }

        audioSpeech.play().catch(err => {
          console.warn('朗讀檔播放失敗/無檔案:', err);
          isSpeechPlaying = false;
          txtSpeech.textContent = "🔊 播放朗讀";
          updateVolume();
        });
      }
      updateDebug();
    }

    function toggleMusic() {
      if (isMusicPlaying) {
        audioMusic.pause();
        isMusicPlaying = false;
        txtMusic.textContent = "🎵 播放音樂";
      } else {
        isMusicPlaying = true;
        txtMusic.textContent = "⏸ 暫停音樂";
        if (!isMuted) {
          audioMusic.play().catch(e => console.log(e));
        }
      }
      updateDebug();
    }

    function toggleMute() {
      isMuted = !isMuted;
      audioSpeech.muted = isMuted;
      audioMusic.muted = isMuted;
      txtMute.textContent = isMuted ? "🔊 解除靜音" : "🔇 靜音";
      updateVolume();
      updateDebug();
    }

    function updateDebug() {
      document.getElementById('debug-page').textContent = currentPage;
      document.getElementById('debug-music').textContent = isMusicPlaying ? '播放中' : '已暫停';
      document.getElementById('debug-speech').textContent = isSpeechPlaying ? '播放中' : '已暫停';
      document.getElementById('debug-mute').textContent = isMuted;
    }

    initThumbnails();
    bindEvents();
    updatePageDirectly();
  </script>
</body>
</html>
