<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mnanak na qalang 電子繪本</title>
  <style>
    :root {
      --bg-color: #1a1512;
      --card-bg: #2d241e;
      --accent-color: #d97736;
      --accent-hover: #f08c4a;
      --text-color: #f3ece7;
      --border-color: #594537;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
    }

    header {
      text-align: center;
      margin-bottom: 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    header h1 { 
      font-size: 1.4rem; 
      color: var(--accent-color); 
      letter-spacing: 2px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .header-totem {
      font-size: 1.2rem;
      color: var(--accent-color);
      opacity: 0.8;
    }

    .book-container {
      position: relative;
      width: 100%;
      max-width: 940px;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.8);
      overflow: hidden;
      min-height: 0;
    }

    .viewport {
      width: 100%;
      flex: 1;
      position: relative;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      min-height: 0;
    }

    .viewport img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* 狀態與載入遮罩 */
    .status-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .status-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* 控制面板 */
    .controls {
      width: 100%;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 12px;
    }

    .nav-group, .audio-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 部落風格自訂翻頁按鈕 */
    .btn-tribal-nav {
      background: linear-gradient(135deg, #4a3528, #2d2017);
      border: 2px solid var(--accent-color);
      color: #fff;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.5);
      transition: all 0.2s ease;
      position: relative;
    }

    .btn-tribal-nav:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--accent-color), #8c4618);
      transform: translateY(-1px) scale(1.03);
      box-shadow: 0 4px 12px rgba(217, 119, 54, 0.4);
    }

    .btn-tribal-nav:disabled {
      background: #3a322c;
      border-color: #5a4e44;
      color: #7a6e64;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .arrow-icon {
      font-size: 1.1rem;
      line-height: 1;
    }

    .page-indicator {
      font-weight: bold;
      font-size: 0.95rem;
      min-width: 100px;
      text-align: center;
      color: #f3ece7;
      letter-spacing: 0.5px;
    }

    /* 功能按鈕 */
    .btn-action {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 18px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .btn-action:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* 音量調節器樣式 */
    .volume-control {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.08);
      padding: 4px 10px;
      border-radius: 15px;
      border: 1px solid rgba(217, 119, 54, 0.3);
    }

    .volume-control label {
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--accent-color);
      user-select: none;
    }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 75px;
      height: 5px;
      border-radius: 3px;
      background: #594537;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* 底部縮圖 */
    .thumbnails {
      width: 100%;
      max-width: 940px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 6px 0 2px 0;
      flex-shrink: 0;
    }

    .thumb {
      width: 48px;
      height: 36px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.45;
      border: 2px solid transparent;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .thumb.active, .thumb:hover { opacity: 1; border-color: var(--accent-color); }
  </style>
</head>
<body>

  <header>
    <span class="header-totem">◆◇◆</span>
    <h1>mnanak na qalang</h1>
    <span class="header-totem">◆◇◆</span>
  </header>

  <main class="book-container">
    <div class="viewport">
      <img id="book-page" src="graphics/0.jpg" alt="繪本畫面">
      
      <!-- 狀態與重試遮罩 -->
      <div id="status-overlay" class="status-overlay">
        <div id="spinner" class="spinner"></div>
        <div id="status-text">載入素材中...</div>
        <button id="btn-retry" class="btn-action" style="display:none;">🔁 素材載入失敗，點此重試</button>
      </div>
    </div>

    <!-- 控制面板 -->
    <div class="controls" role="region" aria-label="繪本控制區">
      <div class="nav-group">
        <!-- 原住民部落風格「上一頁」按鈕 -->
        <button id="btn-prev" class="btn-tribal-nav" aria-label="上一頁">
          <span class="arrow-icon">◀❖</span>
          <span>上一頁</span>
        </button>

        <span class="page-indicator" id="page-num" aria-live="polite">封面 (0 / 19)</span>

        <!-- 原住民部落風格「下一頁」按鈕 -->
        <button id="btn-next" class="btn-tribal-nav" aria-label="下一頁">
          <span>下一頁</span>
          <span class="arrow-icon">❖▶</span>
        </button>
      </div>

      <div class="audio-group">
        <button id="btn-speech" class="btn-action" aria-label="朗讀">
          <span id="txt-speech">🔊 播放朗讀</span>
        </button>

        <button id="btn-music" class="btn-action" aria-label="背景音樂">
          <span id="txt-music">🎵 播放音樂</span>
        </button>

        <!-- 音量微調控制項 -->
        <div class="volume-control">
          <label for="volume-slider">音量</label>
          <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1" title="調整整體音量">
        </div>

        <button id="btn-mute" class="btn-action" aria-label="靜音控制">
          <span id="txt-mute">🔇 靜音</span>
        </button>
      </div>
    </div>
  </main>

  <div class="thumbnails" id="thumb-container" role="tablist" aria-label="頁面縮圖導覽"></div>

  <!-- 音訊播放元件 -->
  <audio id="audio-speech" preload="auto"></audio>
  <audio id="audio-music" loop preload="auto"></audio>

  <script>
    const totalPages = 19;
    let currentPage = 0;

    let isSpeechPlaying = false;
    let isMusicPlaying = false;
    let isMuted = false;
    let masterVolume = 1.0; // 主音量大小 (0.0 ~ 1.0)

    // DOM 元素繫結
    const imgElement = document.getElementById('book-page');
    const pageNumElement = document.getElementById('page-num');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnSpeech = document.getElementById('btn-speech');
    const btnMusic = document.getElementById('btn-music');
    const btnMute = document.getElementById('btn-mute');
    const volumeSlider = document.getElementById('volume-slider');
    
    const txtSpeech = document.getElementById('txt-speech');
    const txtMusic = document.getElementById('txt-music');
    const txtMute = document.getElementById('txt-mute');

    const statusOverlay = document.getElementById('status-overlay');
    const spinner = document.getElementById('spinner');
    const statusText = document.getElementById('status-text');
    const btnRetry = document.getElementById('btn-retry');

    const audioSpeech = document.getElementById('audio-speech');
    const audioMusic = document.getElementById('audio-music');
    const thumbContainer = document.getElementById('thumb-container');

    function init() {
      initThumbnails();
      bindEvents();
      updatePage();
    }

    function initThumbnails() {
      thumbContainer.innerHTML = '';
      for (let i = 0; i <= totalPages; i++) {
        const thumb = document.createElement('img');
        thumb.src = `graphics/${i}.jpg`;
        thumb.className = `thumb ${i === 0 ? 'active' : ''}`;
        thumb.alt = `第 ${i} 頁縮圖`;
        thumb.role = 'tab';
        thumb.addEventListener('click', () => goToPage(i));
        thumbContainer.appendChild(thumb);
      }
    }

    function bindEvents() {
      btnPrev.addEventListener('click', () => changePage(-1));
      btnNext.addEventListener('click', () => changePage(1));
      btnSpeech.addEventListener('click', toggleSpeech);
      btnMusic.addEventListener('click', toggleMusic);
      btnMute.addEventListener('click', toggleMute);
      btnRetry.addEventListener('click', () => updatePage());

      // 音量滑桿動態事件
      volumeSlider.addEventListener('input', (e) => {
        masterVolume = parseFloat(e.target.value);
        updateVolume();
      });

      // 朗讀播放完畢
      audioSpeech.addEventListener('ended', () => {
        isSpeechPlaying = false;
        txtSpeech.textContent = "🔊 播放朗讀";
        restoreMusicVolume();
      });

      // 鍵盤操作控制
      document.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft') changePage(-1);
        if (e.code === 'ArrowRight') changePage(1);
        if (e.code === 'Space') {
          e.preventDefault();
          toggleSpeech();
        }
      });
    }

    function updatePage() {
      showLoading(true);

      audioSpeech.pause();
      audioSpeech.currentTime = 0;
      
      imgElement.src = `graphics/${currentPage}.jpg`;
      pageNumElement.textContent = currentPage === 0 ? `封面 (0 / ${totalPages})` : `第 ${currentPage} 頁 (${currentPage} / ${totalPages})`;

      btnPrev.disabled = (currentPage === 0);
      btnNext.disabled = (currentPage === totalPages);

      document.querySelectorAll('.thumb').forEach((el, idx) => {
        el.classList.toggle('active', idx === currentPage);
        if (idx === currentPage) {
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      });

      audioSpeech.src = `speech/speech${currentPage}.mp3`;
      audioMusic.src = `music/music${currentPage}.mp3`;

      imgElement.onload = () => {
        showLoading(false);
        preloadNextPage();
      };
      
      imgElement.onerror = () => {
        showError("圖片素材載入失敗");
      };

      applyMuteState();
      updateVolume();
      
      if (isSpeechPlaying && !isMuted) {
        duckMusicVolume();
        audioSpeech.play().catch(e => console.log('Speech Autoplay Blocked:', e));
      }
      
      if (isMusicPlaying && !isMuted) {
        audioMusic.play().catch(e => console.log('Music Autoplay Blocked:', e));
      }
    }

    function changePage(delta) {
      const target = currentPage + delta;
      if (target >= 0 && target <= totalPages) {
        currentPage = target;
        updatePage();
      }
    }

    function goToPage(pageIndex) {
      if (pageIndex >= 0 && pageIndex <= totalPages) {
        currentPage = pageIndex;
        updatePage();
      }
    }

    // 聲音與音量管理
    function updateVolume() {
      audioSpeech.volume = masterVolume;
      if (isSpeechPlaying) {
        audioMusic.volume = masterVolume * 0.2; // Ducking音量
      } else {
        audioMusic.volume = masterVolume;
      }
    }

    function duckMusicVolume() {
      audioMusic.volume = masterVolume * 0.2;
    }

    function restoreMusicVolume() {
      audioMusic.volume = masterVolume;
    }

    function toggleSpeech() {
      if (isSpeechPlaying) {
        audioSpeech.pause();
        isSpeechPlaying = false;
        txtSpeech.textContent = "🔊 播放朗讀";
        restoreMusicVolume();
      } else {
        if (isMuted) toggleMute();
        duckMusicVolume();
        audioSpeech.play().then(() => {
          isSpeechPlaying = true;
          txtSpeech.textContent = "⏸ 暫停朗讀";
        }).catch(err => {
          console.warn('朗讀播放失敗：', err);
        });
      }
    }

    function toggleMusic() {
      if (isMusicPlaying) {
        audioMusic.pause();
        isMusicPlaying = false;
        txtMusic.textContent = "🎵 播放音樂";
      } else {
        if (isMuted) toggleMute();
        audioMusic.play().then(() => {
          isMusicPlaying = true;
          txtMusic.textContent = "⏸ 暫停音樂";
        }).catch(err => {
          console.warn('音樂播放失敗：', err);
        });
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      applyMuteState();
    }

    function applyMuteState() {
      audioSpeech.muted = isMuted;
      audioMusic.muted = isMuted;
      txtMute.textContent = isMuted ? "🔊 解除靜音" : "🔇 靜音";
    }

    function preloadNextPage() {
      if (currentPage < totalPages) {
        const nextIdx = currentPage + 1;
        const nextImg = new Image();
        nextImg.src = `graphics/${nextIdx}.jpg`;
      }
    }

    function showLoading(loading) {
      if (loading) {
        statusOverlay.classList.add('active');
        spinner.style.display = 'block';
        statusText.textContent = "載入素材中...";
        btnRetry.style.display = 'none';
      } else {
        statusOverlay.classList.remove('active');
      }
    }

    function showError(msg) {
      statusOverlay.classList.add('active');
      spinner.style.display = 'none';
      statusText.textContent = `⚠️ ${msg}`;
      btnRetry.style.display = 'inline-flex';
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
