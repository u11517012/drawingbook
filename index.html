<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mnanak na qalang 繪本網站</title>
  <style>
    :root {
      --bg-color: #1a1512;
      --card-bg: #2d241e;
      --accent-color: #d97736;
      --text-color: #f3ece7;
      --border-color: #594537;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100vh;
      overflow-x: hidden;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
    }

    header {
      text-align: center;
      margin-bottom: 5px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    header h1 { font-size: 1.4rem; color: var(--accent-color); letter-spacing: 1px; }

    .header-icon { height: 26px; width: auto; }

    .book-container {
      position: relative;
      width: 100%;
      max-width: 920px;
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 4px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.8);
      overflow: hidden;
      min-height: 0;
    }

    .viewport {
      width: 100%;
      flex: 1;
      position: relative;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      min-height: 0;
    }

    .viewport img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* 載入與錯誤遮罩 */
    .status-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .status-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .controls {
      width: 100%;
      padding: 8px 15px;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 10px;
    }

    .nav-group, .audio-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-action {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-action img { height: 20px; width: auto; border-radius: 50%; }
    .btn-action:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); }
    .btn-action:disabled { background: #555 !important; cursor: not-allowed; opacity: 0.4; }

    .page-indicator {
      font-weight: bold;
      font-size: 0.95rem;
      min-width: 110px;
      text-align: center;
      color: #f3ece7;
    }

    .thumbnails {
      width: 100%;
      max-width: 920px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 6px 0 2px 0;
      flex-shrink: 0;
    }

    .thumb {
      width: 48px;
      height: 36px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.45;
      border: 2px solid transparent;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .thumb.active, .thumb:hover { opacity: 1; border-color: var(--accent-color); }
  </style>
</head>
<body>

  <header>
    <img src="spirit.png" class="header-icon" alt="" onerror="this.style.display='none'">
    <h1>mnanak na qalang</h1>
    <img src="spirit.png" class="header-icon" alt="" onerror="this.style.display='none'">
  </header>

  <main class="book-container">
    <div class="viewport">
      <img id="book-page" src="graphics/0.jpg" alt="繪本畫面">
      
      <!-- 狀態與重試遮罩 -->
      <div id="status-overlay" class="status-overlay">
        <div id="spinner" class="spinner"></div>
        <div id="status-text">載入素材中...</div>
        <button id="btn-retry" class="btn-action" style="display:none;">🔁 素材載入失敗，點此重試</button>
      </div>
    </div>

    <!-- 控制面板（提供標準 ARIA 與事件繫結） -->
    <div class="controls" role="region" aria-label="繪本控制區">
      <div class="nav-group">
        <button id="btn-prev" class="btn-action" aria-label="上一頁">
          <img src="left.jpg" alt="" onerror="this.src='left.png'">
          <span>上一頁</span>
        </button>

        <span class="page-indicator" id="page-num" aria-live="polite">封面 (0 / 19)</span>

        <button id="btn-next" class="btn-action" aria-label="下一頁">
          <span>下一頁</span>
          <img src="right.jpg" alt="" onerror="this.src='right.png'">
        </button>
      </div>

      <div class="audio-group">
        <button id="btn-speech" class="btn-action" aria-label="朗讀">
          <img src="read.jpg" alt="" onerror="this.src='read.png'">
          <span id="txt-speech">播放朗讀</span>
        </button>

        <button id="btn-music" class="btn-action" aria-label="背景音樂">
          <img src="spirit.png" alt="" onerror="this.style.display='none'">
          <span id="txt-music">播放音樂</span>
        </button>

        <button id="btn-mute" class="btn-action" aria-label="靜音控制">
          <span id="txt-mute">🔇 靜音</span>
        </button>
      </div>
    </div>
  </main>

  <div class="thumbnails" id="thumb-container" role="tablist" aria-label="頁面縮圖導覽"></div>

  <!-- 音訊載入器 -->
  <audio id="audio-speech" preload="auto"></audio>
  <audio id="audio-music" loop preload="auto"></audio>

  <script>
    const totalPages = 19;
    let currentPage = 0;

    let isSpeechPlaying = false;
    let isMusicPlaying = false;
    let isMuted = false;

    // DOM 元素繫結
    const imgElement = document.getElementById('book-page');
    const pageNumElement = document.getElementById('page-num');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnSpeech = document.getElementById('btn-speech');
    const btnMusic = document.getElementById('btn-music');
    const btnMute = document.getElementById('btn-mute');
    
    const txtSpeech = document.getElementById('txt-speech');
    const txtMusic = document.getElementById('txt-music');
    const txtMute = document.getElementById('txt-mute');

    const statusOverlay = document.getElementById('status-overlay');
    const spinner = document.getElementById('spinner');
    const statusText = document.getElementById('status-text');
    const btnRetry = document.getElementById('btn-retry');

    const audioSpeech = document.getElementById('audio-speech');
    const audioMusic = document.getElementById('audio-music');
    const thumbContainer = document.getElementById('thumb-container');

    // 1. 初始化縮圖與 Event Listeners
    function init() {
      initThumbnails();
      bindEvents();
      updatePage();
    }

    function initThumbnails() {
      thumbContainer.innerHTML = '';
      for (let i = 0; i <= totalPages; i++) {
        const thumb = document.createElement('img');
        thumb.src = `graphics/${i}.jpg`;
        thumb.className = `thumb ${i === 0 ? 'active' : ''}`;
        thumb.alt = `第 ${i} 頁縮圖`;
        thumb.role = 'tab';
        thumb.addEventListener('click', () => goToPage(i));
        thumbContainer.appendChild(thumb);
      }
    }

    function bindEvents() {
      btnPrev.addEventListener('click', () => changePage(-1));
      btnNext.addEventListener('click', () => changePage(1));
      btnSpeech.addEventListener('click', toggleSpeech);
      btnMusic.addEventListener('click', toggleMusic);
      btnMute.addEventListener('click', toggleMute);
      btnRetry.addEventListener('click', () => updatePage());

      // 音訊結束與音量 Ducking 管理
      audioSpeech.addEventListener('ended', () => {
        isSpeechPlaying = false;
        txtSpeech.textContent = "播放朗讀";
        restoreMusicVolume();
      });

      // 鍵盤操控 (Space, ArrowLeft, ArrowRight)
      document.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft') changePage(-1);
        if (e.code === 'ArrowRight') changePage(1);
        if (e.code === 'Space') {
          e.preventDefault();
          toggleSpeech();
        }
      });
    }

    // 2. 核心頁面切換與動態聲音處理
    function updatePage() {
      showLoading(true);

      // 停止並重置舊頁面的朗讀與音樂
      audioSpeech.pause();
      audioSpeech.currentTime = 0;
      
      imgElement.src = `graphics/${currentPage}.jpg`;
      pageNumElement.textContent = currentPage === 0 ? `封面 (0 / ${totalPages})` : `第 ${currentPage} 頁 (${currentPage} / ${totalPages})`;

      // 更新首頁與末頁的按鈕停用狀態 (邊界檢查)
      btnPrev.disabled = (currentPage === 0);
      btnNext.disabled = (currentPage === totalPages);

      // 更新縮圖標記
      document.querySelectorAll('.thumb').forEach((el, idx) => {
        el.classList.toggle('active', idx === currentPage);
        if (idx === currentPage) {
          el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      });

      // 更新音檔 Sources
      audioSpeech.src = `speech/speech${currentPage}.mp3`;
      audioMusic.src = `music/music${currentPage}.mp3`;

      // 圖片載入完成回饋
      imgElement.onload = () => {
        showLoading(false);
        preloadNextPage();
      };
      
      imgElement.onerror = () => {
        showError("圖片素材載入失敗");
      };

      // 音樂與朗讀狀態續行
      applyMuteState();
      
      if (isSpeechPlaying && !isMuted) {
        duckMusicVolume();
        audioSpeech.play().catch(e => console.log('Speech Autoplay Blocked:', e));
      }
      
      if (isMusicPlaying && !isMuted) {
        audioMusic.play().catch(e => console.log('Music Autoplay Blocked:', e));
      }
    }

    function changePage(delta) {
      const target = currentPage + delta;
      if (target >= 0 && target <= totalPages) {
        currentPage = target;
        updatePage();
      }
    }

    function goToPage(pageIndex) {
      if (pageIndex >= 0 && pageIndex <= totalPages) {
        currentPage = pageIndex;
        updatePage();
      }
    }

    // 3. 聲音開關、Ducking (混音降低) 與 Mute 管理
    function toggleSpeech() {
      if (isSpeechPlaying) {
        audioSpeech.pause();
        isSpeechPlaying = false;
        txtSpeech.textContent = "播放朗讀";
        restoreMusicVolume();
      } else {
        if (isMuted) toggleMute(); // 若處於靜音則自動解除靜音
        duckMusicVolume();
        audioSpeech.play().then(() => {
          isSpeechPlaying = true;
          txtSpeech.textContent = "暫停朗讀";
        }).catch(err => {
          console.warn('朗讀播放失敗：', err);
        });
      }
    }

    function toggleMusic() {
      if (isMusicPlaying) {
        audioMusic.pause();
        isMusicPlaying = false;
        txtMusic.textContent = "播放音樂";
      } else {
        if (isMuted) toggleMute();
        audioMusic.play().then(() => {
          isMusicPlaying = true;
          txtMusic.textContent = "暫停音樂";
        }).catch(err => {
          console.warn('音樂播放失敗：', err);
        });
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      applyMuteState();
    }

    function applyMuteState() {
      audioSpeech.muted = isMuted;
      audioMusic.muted = isMuted;
      txtMute.textContent = isMuted ? "🔊 解除靜音" : "🔇 靜音";
    }

    // 朗讀時將背景音樂音量降低至 0.2 (Ducking)
    function duckMusicVolume() {
      audioMusic.volume = 0.2;
    }

    function restoreMusicVolume() {
      audioMusic.volume = 1.0;
    }

    // 4. 預載與 UI 反饋
    function preloadNextPage() {
      if (currentPage < totalPages) {
        const nextIdx = currentPage + 1;
        const nextImg = new Image();
        nextImg.src = `graphics/${nextIdx}.jpg`;
      }
    }

    function showLoading(loading) {
      if (loading) {
        statusOverlay.classList.add('active');
        spinner.style.display = 'block';
        statusText.textContent = "載入素材中...";
        btnRetry.style.display = 'none';
      } else {
        statusOverlay.classList.remove('active');
      }
    }

    function showError(msg) {
      statusOverlay.classList.add('active');
      spinner.style.display = 'none';
      statusText.textContent = `⚠️ ${msg}`;
      btnRetry.style.display = 'inline-flex';
    }

    // 啟動專案
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
